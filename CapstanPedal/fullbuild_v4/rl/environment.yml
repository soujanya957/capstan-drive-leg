# conda env for GPU training (Linux, NVIDIA, CUDA 13 driver):  conda env create -f environment.yml   (see README.md)
name: capstan-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg                    # play.py film
  - pip:
      - mujoco==3.16.0
      - mujoco-mjx==3.16.0
      - warp-lang==1.18.0     # MJX's Warp backend
      - jax[cuda13]==0.12.0.1
      - optax==0.2.8
      - numpy==2.5.4
      - pillow==13.0.0
      - glfw==2.11.0          # teleop.py
